name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Source dependency, secret and configuration vulnerability scan
        run: >-
          mkdir -p "$RUNNER_TEMP/trivy-cache" &&
          docker run --rm
          -v "$GITHUB_WORKSPACE:/workspace:ro"
          -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy"
          ghcr.io/aquasecurity/trivy:0.74.0 fs
          --scanners vuln,secret,misconfig
          --include-dev-deps
          --severity HIGH,CRITICAL
          --exit-code 1
          --skip-dirs /workspace/.git
          --skip-dirs /workspace/node_modules
          --skip-dirs /workspace/.local
          /workspace
      - name: Built application image vulnerability scan
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: npm run security:containers
      - run: npx playwright install --with-deps chrome
      - run: npm run test:regression
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          include-hidden-files: true
          path: |
            .local/regression/*/summary.json
            .local/regression/*/playwright-report/
            .local/regression/*/test-results/
            .local/regression/*/screenshots/
            .local/regression/*/restore-verification/
          retention-days: 7

  deploy:
    name: Deploy Hostinger VPS
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: rare-os-production
      cancel-in-progress: false
    steps:
      - name: Deploy checked commit using restricted SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Add VPS_HOST secret}"
          : "${VPS_USER:?Add VPS_USER secret}"
          : "${VPS_SSH_KEY:?Add VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Add VPS_KNOWN_HOSTS secret}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 "$RUNNER_TEMP/rare-os-ssh"
          trap 'rm -rf "$RUNNER_TEMP/rare-os-ssh"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/rare-os-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/rare-os-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/rare-os-ssh/"*
          ssh -T -i "$RUNNER_TEMP/rare-os-ssh/key" \
            -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rare-os-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$VPS_USER@$VPS_HOST" "deploy $DEPLOY_SHA"
