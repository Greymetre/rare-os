log_format rare '$remote_addr $request_method $uri $status';
server {
 listen 8080;
 server_name _;
 server_tokens off;
 access_log /dev/stdout rare;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 # Requests are small everywhere except imports, so the default cap stays low and only the
 # import routes are allowed the sizes a CSV or an ERP workbook actually has.
 client_max_body_size 1m;
 location /api/imports {
   resolver 127.0.0.11 valid=5s ipv6=off;
   resolver_timeout 5s;
   set $api_backend http://api:4000;
   # 40 MB for a workbook (the real sales export is 33.6 MB); the API enforces the same limit.
   client_max_body_size 40m;
   proxy_request_buffering off;
   proxy_read_timeout 300s;
   proxy_send_timeout 300s;
   proxy_pass $api_backend$request_uri;
   proxy_hide_header X-Content-Type-Options;
   proxy_hide_header Referrer-Policy;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location /api/ {
   # Resolve through Docker DNS at runtime, including after API container replacement.
   resolver 127.0.0.11 valid=5s ipv6=off;
   resolver_timeout 5s;
   set $api_backend http://api:4000;
   proxy_pass $api_backend$request_uri;
   proxy_hide_header X-Content-Type-Options;
   proxy_hide_header Referrer-Policy;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 # RCH-8: the field app is a separate single-page app under /mobile/, so a deep link inside it
 # must fall back to the field app's own shell and not the desk app's.
 #
 # It is also the only place in this system allowed to ask for a camera or a location. The desk
 # app keeps `camera=(), geolocation=()` — not even its own page may ask — and this location
 # widens those two to `(self)` and nothing more. That is not a grant: the browser still asks
 # the rep, per device, and a refusal is recorded as no photo and no fix rather than a blocked
 # visit. Scoping it here rather than at the server means a future screen on the desk app
 # cannot quietly start asking for either.
 #
 # Every other header is repeated because nginx's `add_header` in a location replaces the
 # inherited set rather than adding to it. Leaving one out here would silently drop it for the
 # app that runs on an unlocked phone in a market.
 location /mobile/ {
   add_header X-Content-Type-Options nosniff always;
   add_header X-Frame-Options DENY always;
   add_header Referrer-Policy same-origin always;
   add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
   add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
   try_files $uri $uri/ /mobile/index.html;
 }
 # The service worker must be allowed to control the whole of /mobile/, and a browser only
 # grants a worker scope at or below its own path. Served from /mobile/ it already is, but it
 # must never be cached: a stale worker is a stale app that cannot be replaced.
 location = /mobile/sw.js {
   add_header Cache-Control "no-cache" always;
   try_files $uri =404;
 }
 # RCH-8: the two Keycloak endpoints the field app calls with fetch, proxied so that they are
 # same-origin. Without this the app would need `connect-src` widened to the identity server
 # and Keycloak would need CORS for this origin — two loosenings, in two places, that drift.
 # Only the token and logout endpoints are here. The sign-in page itself is a top-level
 # redirect to the real identity server, as it should be: a login form must show its own
 # address bar.
 location ~ ^/auth/realms/[^/]+/protocol/openid-connect/(token|logout)$ {
   resolver 127.0.0.11 valid=5s ipv6=off;
   resolver_timeout 5s;
   set $auth_backend http://keycloak:8080;
   rewrite ^/auth/(.*)$ /$1 break;
   proxy_pass $auth_backend;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { expires 1y; }
}
