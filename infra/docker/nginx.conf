log_format rare '$remote_addr $request_method $uri $status';
server {
 listen 8080;
 server_name _;
 server_tokens off;
 access_log /dev/stdout rare;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ {
   # Resolve through Docker DNS at runtime, including after API container replacement.
   resolver 127.0.0.11 valid=5s ipv6=off;
   resolver_timeout 5s;
   set $api_backend http://api:4000;
   proxy_pass $api_backend$request_uri;
   proxy_hide_header X-Content-Type-Options;
   proxy_hide_header Referrer-Policy;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { expires 1y; }
}
